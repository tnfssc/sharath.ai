packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@google/genai": true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@google/genai"
  - core-js
  - esbuild
  - oxc-resolver
  - protobufjs
  - rolldown
  - sharp
  - unrs-resolver
  - workerd
minimumReleaseAgeExclude:
  - daisyui
  - '@cloudflare/workers-types@5.20260705.1'
overrides:
  seroval: ^1.6.11
  dompurify: ^3.4.17
  sharp: ^0.35.5
  undici: ^7.30.1
  launch-editor: ^2.14.2
  "@vitest/mocker": ^4.1.12
